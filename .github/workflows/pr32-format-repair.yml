name: PR32 canonical format repair
on:
  push:
    branches: [feature/rad-global-time-premium]
    paths: ['.github/workflows/pr32-format-repair.yml']
permissions:
  contents: write
jobs:
  repair:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/rad-global-time-premium
          persist-credentials: true
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.47.6'
          channel: stable
          cache: true
      - name: Canonical formatter and lockfile
        run: |
          set -euo pipefail
          flutter pub get
          dart format lib test
          git diff --check
          git add lib test pubspec.lock
          if git diff --cached --quiet; then exit 0; fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'style(global-time): canonical Dart 3.13.5 format and lockfile'
          git push origin HEAD:feature/rad-global-time-premium
