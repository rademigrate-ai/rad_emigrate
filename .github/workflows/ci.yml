name: CI

on:
  workflow_dispatch:
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/**'
      - 'lib/**'
      - 'web/**'
      - 'test/**'
      - 'android/**'
      - 'gradle/**'
      - 'pubspec.yaml'
      - 'pubspec.lock'
      - 'build.gradle*'
      - 'settings.gradle*'
      - 'gradle.properties'
      - 'supabase/**'
      - 'scripts/**'
      - 'tools/plan3_content/**'
      - 'requirements-plan3.txt'
      - 'artifacts/RAD_PLAN3_VISA_CONTENT_20261024/**'
      - 'PLAN3_INTEGRATION_HANDOFF.md'
      - 'docs/plan3_integration_evidence/**'
  push:
    branches: [main]
    paths:
      - '.github/workflows/**'
      - 'lib/**'
      - 'web/**'
      - 'test/**'
      - 'android/**'
      - 'gradle/**'
      - 'pubspec.yaml'
      - 'pubspec.lock'
      - 'build.gradle*'
      - 'settings.gradle*'
      - 'gradle.properties'
      - 'supabase/**'
      - 'scripts/**'
      - 'tools/plan3_content/**'
      - 'requirements-plan3.txt'
      - 'artifacts/RAD_PLAN3_VISA_CONTENT_20261024/**'
      - 'PLAN3_INTEGRATION_HANDOFF.md'
      - 'docs/plan3_integration_evidence/**'

permissions:
  contents: read

# Cancel superseded PR runs; keep main-branch runs intact.
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  routing:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Verify production recovery callback normalization
        run: node scripts/check_password_recovery_redirect.cjs
      - uses: denoland/setup-deno@v2
        with:
          deno-version: v2.5.4
      - run: deno test --allow-env --allow-read=. supabase/functions/tests
      - name: Lint Edge Functions without rule suppressions
        run: deno lint supabase/functions
      - name: Run Python security, migration and preflight regressions
        # Plan 3 tests use the same pinned parser/schema validators as ingestion.
        run: |
          python3 -m pip install -r requirements-plan3.txt
          python3 -m unittest discover -s scripts/tests -v

  plan3-content:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: python3 -m pip install -r requirements-plan3.txt
      - name: Format and lint owned content tools
        run: |
          python3 -m ruff format --isolated --check tools/plan3_content scripts/tests/test_plan3_content.py
          python3 -m ruff check --isolated --select E4,E7,E9,F,I,UP,B --target-version py311 tools/plan3_content scripts/tests/test_plan3_content.py
      - name: Verify sealed source library and closed draft contract
        run: |
          python3 -m tools.plan3_content.cli checksums --directory artifacts/RAD_PLAN3_VISA_CONTENT_20261024
          python3 -m tools.plan3_content.cli validate --package artifacts/RAD_PLAN3_VISA_CONTENT_20261024/10_CMS_DRAFT_IMPORT_PACKAGE.json
          python3 -m tools.plan3_content.cli library --directory artifacts/RAD_PLAN3_VISA_CONTENT_20261024
      - name: Reproduce sealed library offline with identical bytes
        run: |
          python3 - <<'PY'
          import json, os, shutil
          from pathlib import Path
          from tools.plan3_content.build import build
          from tools.plan3_content.dataset import read_jsonl
          original = Path('artifacts/RAD_PLAN3_VISA_CONTENT_20261024')
          data = original / 'data'
          target = Path(os.environ['RUNNER_TEMP']) / 'plan3-offline-rebuild'
          target.mkdir()
          (target / 'data').mkdir()
          shutil.copy2(data / 'canonical_identity_registry.json', target / 'data/canonical_identity_registry.json')
          shutil.copytree(original / 'evidence', target / 'evidence')
          def read(name):
              return json.loads((data / name).read_text(encoding='utf8'))
          build(read_jsonl(data / 'capture.jsonl.gz'), read('production_content_baseline.json'),
                read('production_structured_baseline.json'), read('discovery.json'), target,
                Path('supabase/contracts/rad_v1.json'), schema_gate=read('production_canonical_schema_gate.json'))
          if (original / 'CHECKSUMS.sha256').read_bytes() != (target / 'CHECKSUMS.sha256').read_bytes():
              def manifest(directory):
                  return {name: digest for digest, name in (line.split('  ', 1) for line in (directory / 'CHECKSUMS.sha256').read_text().splitlines())}
              expected, actual = manifest(original), manifest(target)
              print('Different sealed files:', sorted(name for name in expected if expected[name] != actual.get(name)))
              raise AssertionError('Offline rebuild differs from the sealed delivery')
          print('PASS: complete source library and generated delivery are byte-for-byte reproducible')
          PY
      - name: Rehearse whole-package journal import and exact retry
        run: >-
          python3 -m tools.plan3_content.importer sqlite
          --package artifacts/RAD_PLAN3_VISA_CONTENT_20261024/10_CMS_DRAFT_IMPORT_PACKAGE.json
          --sqlite-db "$RUNNER_TEMP/plan3-journal.sqlite"
          --output "$RUNNER_TEMP/plan3-journal-result.json"
      - uses: actions/upload-artifact@v4
        with:
          name: plan3-journal-rehearsal
          path: ${{ runner.temp }}/plan3-journal-result.json

  flutter:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.47.6'
          channel: stable
          cache: true
      - run: flutter --version
      - run: flutter pub get
      - name: Dart format gate
        run: |
          set -euo pipefail
          if ! dart format --set-exit-if-changed lib test; then
            echo '::error::dart format would change files. Listing offenders:'
            dart format lib test
            git --no-pager diff --name-only
            git --no-pager diff --stat
            git --no-pager diff -- lib/l10n/app_localizations_en_a.dart lib/l10n/app_localizations_fa_a.dart
            exit 1
          fi
      - run: flutter analyze --no-pub
      - run: flutter test --no-pub
      - run: git diff --check

  web-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.47.6'
          channel: stable
          cache: true
      - run: flutter pub get
      - name: Build web with non-production configuration
        run: >-
          flutter build web --no-pub
          --dart-define=SUPABASE_URL=https://example.supabase.co
          --dart-define=SUPABASE_ANON_KEY=sb_publishable_ci_placeholder

  android-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.47.6'
          channel: stable
          cache: true
      - run: flutter pub get
      - name: Set up Gradle cache
        uses: gradle/actions/setup-gradle@v4
        with:
          cache-read-only: ${{ github.event_name == 'pull_request' }}
          cache-cleanup: on-success
      - name: Build Android debug variant
        run: >-
          flutter build apk --debug --no-pub
          --target-platform android-arm64
      - name: Verify Android release signing is opt-in
        shell: bash
        run: |
          set -euo pipefail
          signing_vars=(
            RAD_RELEASE_STORE_FILE
            RAD_RELEASE_STORE_PASSWORD
            RAD_RELEASE_KEY_ALIAS
            RAD_RELEASE_KEY_PASSWORD
          )
          for name in "${signing_vars[@]}"; do
            if [[ -n "${!name:-}" ]]; then
              echo "Unexpected release signing value in CI: $name" >&2
              exit 1
            fi
          done
          echo "Release packaging remains blocked until owner-provided signing values are configured."
      - name: Verify placeholder Android identity blocks release packaging
        shell: bash
        run: |
          set -euo pipefail
          if ./android/gradlew -p android :app:verifyReleaseSigning >release-check.log 2>&1; then
            echo "Release verification unexpectedly accepted placeholder identity/signing." >&2
            exit 1
          fi
          grep -F "RAD_ANDROID_APPLICATION_ID" release-check.log

  repository-keyword-scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Validate 47-gate delivery evidence ledger (no invented completion)
        run: python3 -m unittest discover -s scripts/tests -p test_master_47_delivery_ledger.py -v
      - name: Scan tracked files for audit keywords (paths only)
        run: |
          git grep -I -i -l -E 'TODO|FIXME|demo|fake|mock|password|service_role|secret|SUPABASE_SERVICE' HEAD -- . ':(exclude).github/workflows/ci.yml' || true
          if git grep -I -i -l -E 'sb_secret_[A-Za-z0-9]+|eyJ[A-Za-z0-9_-]{40,}[.][A-Za-z0-9_-]{20,}|AKIA[0-9A-Z]{16}|-----BEGIN (RSA |EC |OPENSSH )?PRIVATE KEY-----|SUPABASE_SERVICE_ROLE_KEY[[:space:]]*=[[:space:]]*[^<$[:space:]][^[:space:]]+' HEAD -- . ':(exclude)pubspec.lock'; then
            echo "Potential high-risk secret pattern found in the paths above." >&2
            exit 1
          else
            scan_status=$?
            if [ "$scan_status" -ne 1 ]; then
              echo "High-risk credential scan failed with git grep exit code $scan_status." >&2
              exit "$scan_status"
            fi
            echo "No high-risk credential patterns found."
          fi

  clean-schema:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: supabase/setup-cli@v1
        with:
          version: 2.119.0
      - name: Ensure PostgreSQL client is available
        run: |
          if command -v psql >/dev/null 2>&1; then
            echo "Using preinstalled PostgreSQL client: $(psql --version)"
          else
            sudo apt-get update
            sudo apt-get install --yes postgresql-client
          fi
      - name: Rebuild clean Supabase schema
        run: KEEP_SUPABASE_RUNNING=1 bash scripts/verify_clean_schema.sh
      - name: Test local Auth, RLS, and Storage with two JWTs
        run: python3 scripts/verify_local_auth_isolation.py
      - name: Verify no authenticated cross-user entitlement RPC access
        run: psql "${SUPABASE_DB_URL:-postgresql://postgres:postgres@127.0.0.1:54322/postgres}" -X -v ON_ERROR_STOP=1 -f supabase/tests/ai_entitlement_rpc_privacy.sql
      - name: Rehearse complete Plan 3 draft package against owned CMS with rollback
        run: |
          python3 -m pip install -r requirements-plan3.txt
          python3 - <<'PY'
          import json, os
          from pathlib import Path
          marker = {'project': 'rad_emigrate', 'port': 54322, 'owner_checkout': str(Path.cwd())}
          (Path(os.environ['RUNNER_TEMP']) / 'plan3-runtime.json').write_text(json.dumps(marker))
          PY
          python3 -m tools.plan3_content.importer postgres \
            --package artifacts/RAD_PLAN3_VISA_CONTENT_20261024/10_CMS_DRAFT_IMPORT_PACKAGE.json \
            --db-url postgresql://postgres:postgres@127.0.0.1:54322/postgres \
            --runtime-marker "$RUNNER_TEMP/plan3-runtime.json" --allow-disposable-write \
            --output "$RUNNER_TEMP/plan3-postgres-result.json"
      - uses: actions/upload-artifact@v4
        with:
          name: plan3-postgres-rehearsal
          path: ${{ runner.temp }}/plan3-postgres-result.json
          if-no-files-found: error
      - name: Plan5 AI fail-closed and owner-scope regression
        run: psql "${SUPABASE_DB_URL:-postgresql://postgres:postgres@127.0.0.1:54322/postgres}" -X -v ON_ERROR_STOP=1 -f supabase/tests/plan5_ai_fail_closed_regression.sql
      - name: Plan5 AI v1 RPC surface (reserve/settle)
        run: psql "${SUPABASE_DB_URL:-postgresql://postgres:postgres@127.0.0.1:54322/postgres}" -X -v ON_ERROR_STOP=1 -f supabase/tests/plan5_ai_v1_rpc_surface.sql
      - name: Verify appointment RPC contracts and owner-scoped persisted receipts
        run: psql "${SUPABASE_DB_URL:-postgresql://postgres:postgres@127.0.0.1:54322/postgres}" -X -v ON_ERROR_STOP=1 -f supabase/tests/pr82_appointment_contract.sql
      - name: Verify targeted privilege and discovery regression contracts
        run: |
          psql "${SUPABASE_DB_URL:-postgresql://postgres:postgres@127.0.0.1:54322/postgres}" -X -v ON_ERROR_STOP=1 -f supabase/tests/pr82_privilege_discovery.sql
      - name: Verify missing-profile bootstrap cannot provision privileged roles
        run: psql "${SUPABASE_DB_URL:-postgresql://postgres:postgres@127.0.0.1:54322/postgres}" -X -v ON_ERROR_STOP=1 -f supabase/tests/pr82_profile_bootstrap.sql
      - name: Verify shipped profile upsert preserves identity, timestamps and roles
        run: psql "${SUPABASE_DB_URL:-postgresql://postgres:postgres@127.0.0.1:54322/postgres}" -X -v ON_ERROR_STOP=1 -f supabase/tests/pr82_profile_upsert.sql
      - name: Verify legacy keyed request replay rejects changed payloads
        run: psql "${SUPABASE_DB_URL:-postgresql://postgres:postgres@127.0.0.1:54322/postgres}" -X -v ON_ERROR_STOP=1 -f supabase/tests/pr82_legacy_request_receipts.sql
      - name: Verify newly created functions fail closed for client execution
        run: psql "${SUPABASE_DB_URL:-postgresql://postgres:postgres@127.0.0.1:54322/postgres}" -X -v ON_ERROR_STOP=1 -f supabase/tests/pr82_function_defaults.sql
      - name: Verify publication-head deletion invalidates only its search projection
        run: psql "${SUPABASE_DB_URL:-postgresql://postgres:postgres@127.0.0.1:54322/postgres}" -X -v ON_ERROR_STOP=1 -f supabase/tests/pr82_search_head_delete.sql
      - name: Verify appointment receipts through real Auth and PostgREST
        run: python3 scripts/verify_pr82_appointment_e2e.py --allow-disposable-write --runtime-marker "$RUNNER_TEMP/plan3-runtime.json"
      - name: Stop disposable Supabase stack
        if: always()
        run: supabase stop --no-backup >/dev/null 2>&1 || true

  migration-reconstruction:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Regression-test read-only live migration history stop gate
        run: python3 -m unittest discover -s scripts/tests -p test_audit_migration_ledger_readonly.py -v
      - name: Verify recorded Production migration SQL fingerprint audit stays NO-GO
        run: python3 -m unittest discover -s scripts/tests -p test_live_migration_sql_fingerprints.py -v
      - uses: supabase/setup-cli@v1
        with:
          version: 2.119.0
      - name: Ensure PostgreSQL client is available
        run: |
          if command -v psql >/dev/null 2>&1; then
            echo "Using preinstalled PostgreSQL client: $(psql --version)"
          else
            sudo apt-get update
            sudo apt-get install --yes postgresql-client
          fi
      - name: Reconstruct authoritative lineage and compare production metadata
        run: bash scripts/verify_migration_reconstruction.sh
      - name: Upload metadata-only reconciliation proof
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: migration-reconstruction-proof
          path: |
            reconstructed-catalog.json
            reconciliation-report.json
            reconstruction-migration-list.txt
            reconstruction-dry-run.txt
          if-no-files-found: ignore
