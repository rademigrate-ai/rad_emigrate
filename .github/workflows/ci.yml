name: CI

on:
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/ci.yml'
      - 'lib/**'
      - 'test/**'
      - 'pubspec.yaml'
      - 'pubspec.lock'
      - 'supabase/**'
      - 'scripts/verify_clean_schema.sh'
  push:
    branches: [main]
    paths:
      - '.github/workflows/ci.yml'
      - 'lib/**'
      - 'test/**'
      - 'pubspec.yaml'
      - 'pubspec.lock'
      - 'supabase/**'
      - 'scripts/verify_clean_schema.sh'

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  flutter:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - run: flutter --version
      - run: flutter pub get
      - run: dart format --set-exit-if-changed lib test
      - run: flutter analyze
      - run: flutter test
      - name: Build web with non-production configuration
        run: >-
          flutter build web
          --dart-define=SUPABASE_URL=https://example.supabase.co
          --dart-define=SUPABASE_ANON_KEY=sb_publishable_ci_placeholder
      - run: git diff --check

  clean-schema:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: supabase/setup-cli@v1
        with:
          version: latest
      - name: Install PostgreSQL client
        run: |
          sudo apt-get update
          sudo apt-get install --yes postgresql-client
      - name: Rebuild clean Supabase schema
        run: bash scripts/verify_clean_schema.sh
