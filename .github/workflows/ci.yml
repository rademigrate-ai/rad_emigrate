name: CI

on:
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/ci.yml'
      - 'lib/**'
      - 'test/**'
      - 'android/**'
      - 'gradle/**'
      - 'pubspec.yaml'
      - 'pubspec.lock'
      - 'build.gradle*'
      - 'settings.gradle*'
      - 'gradle.properties'
      - 'supabase/**'
      - 'scripts/**'
  push:
    branches: [main]
    paths:
      - '.github/workflows/ci.yml'
      - 'lib/**'
      - 'test/**'
      - 'android/**'
      - 'gradle/**'
      - 'pubspec.yaml'
      - 'pubspec.lock'
      - 'build.gradle*'
      - 'settings.gradle*'
      - 'gradle.properties'
      - 'supabase/**'
      - 'scripts/**'

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  flutter:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - run: flutter --version
      - run: flutter pub get
      - name: Report dependency update status
        run: flutter pub outdated
      - run: dart format --set-exit-if-changed lib test
      - run: flutter analyze
      - run: flutter test
      - name: Build web with non-production configuration
        run: >-
          flutter build web
          --dart-define=SUPABASE_URL=https://example.supabase.co
          --dart-define=SUPABASE_ANON_KEY=sb_publishable_ci_placeholder
      - name: Build Android debug variant
        run: flutter build apk --debug
      - name: Verify Android release refuses missing signing values
        shell: bash
        run: |
          set +e
          flutter build apk --release > "$RUNNER_TEMP/release-signing-check.log" 2>&1
          build_status=$?
          set -e
          if [ "$build_status" -eq 0 ]; then
            echo "Release build unexpectedly succeeded without signing values."
            exit 1
          fi
          if ! grep -Fq "Android release build requires" "$RUNNER_TEMP/release-signing-check.log"; then
            tail -n 60 "$RUNNER_TEMP/release-signing-check.log"
            echo "Release build failed for an unexpected reason."
            exit 1
          fi
          echo "Release packaging is blocked until owner-provided signing values are configured."
      - run: git diff --check

  repository-keyword-scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Scan tracked files for audit keywords (paths only)
        run: |
          git grep -I -i -l -E 'TODO|FIXME|demo|fake|mock|password|service_role|secret|SUPABASE_SERVICE' HEAD -- . ':(exclude).github/workflows/ci.yml' || true
          if git grep -I -i -l -E 'sb_secret_[A-Za-z0-9]+|eyJ[A-Za-z0-9_-]{40,}[.][A-Za-z0-9_-]{20,}|AKIA[0-9A-Z]{16}|-----BEGIN (RSA |EC |OPENSSH )?PRIVATE KEY-----|SUPABASE_SERVICE_ROLE_KEY[[:space:]]*=[[:space:]]*[^<$[:space:]][^[:space:]]+' HEAD -- . ':(exclude)pubspec.lock'; then
            echo "Potential high-risk secret pattern found in the paths above." >&2
            exit 1
          else
            scan_status=$?
            if [ "$scan_status" -ne 1 ]; then
              echo "High-risk credential scan failed with git grep exit code $scan_status." >&2
              exit "$scan_status"
            fi
            echo "No high-risk credential patterns found."
          fi

  clean-schema:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: supabase/setup-cli@v1
        with:
          version: 2.119.0
      - name: Install PostgreSQL client
        run: |
          sudo apt-get update
          sudo apt-get install --yes postgresql-client
      - name: Rebuild clean Supabase schema
        run: KEEP_SUPABASE_RUNNING=1 bash scripts/verify_clean_schema.sh
      - name: Install temporary local Storage insert diagnostic
        run: psql "postgresql://postgres:postgres@127.0.0.1:54322/postgres" -v ON_ERROR_STOP=1 -f scripts/storage_insert_diagnostic.sql
      - name: Test local Auth, RLS, and Storage with two JWTs
        run: python3 scripts/verify_local_auth_isolation.py
      - name: Print local Storage insert diagnostic and remove trigger
        if: always()
        shell: bash
        run: |
          containers=$(docker ps --format '{{.Names}}' | grep '^supabase_db_' || true)
          if command -v psql >/dev/null 2>&1 && pg_isready -h 127.0.0.1 -p 54322 >/dev/null 2>&1; then
            for container in $containers; do
              docker logs "$container" 2>&1 | grep 'PROJECT08_STORAGE_DIAGNOSTIC' || true
            done
            psql "postgresql://postgres:postgres@127.0.0.1:54322/postgres" -v ON_ERROR_STOP=1 -c 'DROP TRIGGER IF EXISTS project08_storage_insert_diagnostic ON storage.objects; DROP FUNCTION IF EXISTS public.project08_storage_insert_diagnostic();'
          else
            echo "Disposable Supabase database was not started; no diagnostic trigger requires cleanup."
          fi
      - name: Stop disposable Supabase stack
        if: always()
        run: supabase stop --no-backup >/dev/null 2>&1 || true
