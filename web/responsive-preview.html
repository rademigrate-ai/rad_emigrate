<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>RAD responsive acceptance</title>
<style>body{margin:0;background:#e9edf2;font:14px system-ui}header{padding:12px;display:flex;gap:12px;align-items:center;background:white}button{padding:10px;cursor:pointer}main{display:flex;justify-content:center;padding:16px}iframe{border:1px solid #c5cdd8;background:white;width:390px;height:844px;max-width:100%}</style></head>
<body><header>Actual RAD application viewport <button type="button" data-width="390">390 px</button><button type="button" data-width="768">768 px</button><button type="button" data-width="1280">1280 px</button></header><main><iframe id="rad-preview" title="RAD application" src="./"></iframe></main>
<script>document.querySelectorAll('button').forEach(button=>button.addEventListener('click',()=>{document.querySelector('iframe').style.width=button.dataset.width+'px';}));</script></body></html>
