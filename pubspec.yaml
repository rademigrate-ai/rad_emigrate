name: rad_emigrate
description: "RAD Emigrate - International Institute of RAD"
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ^3.13.4

flutter:
  uses-material-design: true
  generate: false
  assets:
    - assets/branding/
    - assets/images/
    - assets/icons/
    - assets/flags/

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  intl: any
  cupertino_icons: ^1.0.8
  flutter_riverpod: ^2.6.1
  go_router: ^15.1.2
  dio: ^5.8.0+1
  flutter_secure_storage: ^9.2.4
  shared_preferences: ^2.5.3
  freezed_annotation: ^3.0.0
  json_annotation: ^4.9.0
  supabase_flutter: ^2.18.0
  file_picker: ^11.0.3

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  build_runner: ^2.4.15
  freezed: ^3.0.6
  json_serializable: ^6.9.5
